<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motovra | Book Now</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#111;
    color:#fff;
    padding:15px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    color:#ff3c00;
}

form{
    max-width:700px;
    margin:50px auto;
    background:#fff;
    padding:40px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

form h2{
    text-align:center;
    margin-bottom:25px;
}

input:not([type="checkbox"]), select, textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:5px;
    border:1px solid #ccc;
}

textarea{
    margin-top: 10px;
    resize:none;
    height:100px;
}

button{
    width:100%;
    background:#ff3c00;
    color:#fff;
    padding:12px;
    border:none;
    border-radius:5px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#e63300;
}
/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:3000;
}

.popup-content{
    background:#1a1a1a;
    padding:40px;
    border-radius:10px;
    text-align:center;
    width:350px;
    animation:pop 0.3s ease;
}

.popup-content h2{
    color:#ff3c00;
    margin-bottom:15px;
}

.popup-content button{
    margin-top:20px;
    padding:10px 20px;
    background:#ff3c00;
    border:none;
    color:#fff;
    border-radius:5px;
    cursor:pointer;
}

@keyframes pop{
    from{transform:scale(0.8); opacity:0;}
    to{transform:scale(1); opacity:1;}
}
.services, .about-content {
    padding: 80px 20px;
}

/* Desktop fix */
@media (min-width: 1024px){
    .services, .about-content {
        padding: 100px 80px;
    }
}
.navbar {
    padding: 15px 20px;
}

@media (min-width: 1024px){
    .navbar {
        padding: 20px 60px;
    }
}
.services-box{
    margin-bottom: 20px;

    display: flex;
    flex-direction: column;
    align-items: flex-start;   /* left align */
    width: 100%;
}

.services-box label{
    display: flex;
    align-items: center;
    justify-content: flex-start;  /* force left */
    gap: 10px;
    width: 100%;
    text-align: left;
}

</style>
</head>

<body>

<header>
    <h1>Motovra</h1>
    <a href="index.html" style="color:#fff;text-decoration:none;">Home</a>
</header>

<form id="contactForm">
    <h2>Book Your Detailing Service</h2>

<input type="text" name="name" placeholder="Full Name" required>
<input type="tel" name="phone" placeholder="Phone Number" required>
<input type="email" name="email" placeholder="Email Address" required>
<input type="text" name="address" placeholder="Address" required>
<input type="text" name="district" placeholder="District" required>
<input type="text" name="zip" placeholder="Zip Code" required>
<input type="text" name="vehicle" placeholder="Vehicle Model" required>

<input type="date" name="date" required>
<input type="time" name="time" required>

<select name="plan" required>
        <option value="">Select Plan</option>
        <option>Basic Wash</option>
        <option>Premium Detail</option>
        <option>Ceramic Coating</option>
    </select>

<label>Select Services:</label>

<div class="services-box">
    <label><input type="checkbox" name="services" value="Exterior Wash"> Exterior Wash</label>
    <label><input type="checkbox" name="services" value="Interior Cleaning"> Interior Cleaning</label>
    <label><input type="checkbox" name="services" value="Wax Polish"> Wax Polish</label>
    <label><input type="checkbox" name="services" value="Engine Bay Cleaning"> Engine Bay Cleaning</label>
    <label><input type="checkbox" name="services" value="Headlight Restoration"> Headlight Restoration</label>
</div>    

<label>Please Let Us Know Your Requirement:</label>
<textarea name="requirements" placeholder="Write your requirements here..."></textarea>

    <button type="submit">Submit Booking</button>
</form>
<!-- SUCCESS POPUP -->
<div class="popup" id="successPopup">
    <div class="popup-content">
        <h2>✅ Message Sent!</h2>
        <p>Thank you for contacting Motovra. We’ll get back to you soon.</p>
        <button onclick="closePopup()">Close</button>
    </div>
</div>
<script>
const form = document.getElementById("contactForm");

form.addEventListener("submit", function(e){
    e.preventDefault();

    const data = {
        name: form.name.value,
        phone: form.phone.value,
        email: form.email.value,
        address: form.address.value,
        district: form.district.value,
        zip: form.zip.value,
        vehicle: form.vehicle.value,
        date: form.date.value,
        time: form.time.value,
        plan: form.plan.value,
        services: Array.from(
            form.querySelectorAll('input[name="services"]:checked')
        ).map(cb => cb.value).join(", "),
        requirements: form.requirements.value
    };
    const slotKey = data.date + "_" + data.time;
data.slotKey = slotKey;

    fetch("https://script.google.com/macros/s/AKfycbx3xkbCONFRt4A5oy9-MGrRKitDTBLNi0Rv4-uTsXyajCQh7SeZ9XPDp_hgqYWEyCpCww/exec", {
        method: "POST",
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(result => {

        // 🔥 DEBUG (you can remove later)
        console.log("Server:", result);

        if(result.includes("duplicate")){
            alert("❌ This time slot is already booked.");
            return;
        }

        // ✅ WhatsApp message
        const message = `
🚗 *New Booking - Motovra*

👤 Name: ${data.name}
📞 Phone: ${data.phone}

📅 Date: ${data.date}
⏰ Time: ${data.time}

📦 Plan: ${data.plan}

🛠 Services: ${data.services || "None"}
📝 Requirements: ${data.requirements || "None"}
`;

        const url = `https://wa.me/917892252551?text=${encodeURIComponent(message)}`;

        window.location.href = url;

        form.reset();
    })
    .catch(err => {
        console.error(err);
        alert("Error sending booking");
    });
});
</script>
</body>
</html>
